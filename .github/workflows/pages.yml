name: Build and deploy atlas

on:
  schedule:
    # Every 2 hours. Open-Meteo's free tier allows about this many builds a day.
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # to append snapshots to the data branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Terrain, land cover, monthly snow, rivers and gauge baselines change
      # rarely; keep them between runs so each build only fetches live data.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: cache
          key: atlas-cache-${{ github.run_id }}
          restore-keys: atlas-cache-

      - run: python build.py && rm -f dist/artifact.html

      # Point-in-time archive: file this build's snapshot into the data branch.
      - name: Check out the archive branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: archive

      - name: Archive this build
        run: |
          python -m nowcast.archive snapshot archive
          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
